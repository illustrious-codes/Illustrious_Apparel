{% extends 'partials/base.html' %} {% load static %} {% block content %}
<!-- Full-page centered container -->
<div
  style="
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    box-sizing: border-box;
  "
>
  <div
    style="
      text-align: center;
      max-width: 820px;
      width: 100%;
      padding: 48px 24px;
    "
  >
    <!-- Big red X icon (SVG) -->
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      "
    >
      <!-- Circular soft shadow behind (subtle) -->
      <div
        style="
          width: 170px;
          height: 170px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 50%;
          background: transparent;
        "
      >
        <!-- Red X SVG -->
        <svg
          width="140"
          height="140"
          viewBox="0 0 64 64"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          role="img"
        >
          <line
            x1="10"
            y1="10"
            x2="54"
            y2="54"
            stroke="#E53935"
            stroke-width="6"
            stroke-linecap="round"
          />
          <line
            x1="54"
            y1="10"
            x2="10"
            y2="54"
            stroke="#E53935"
            stroke-width="6"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>

    <!-- Main heading -->
    <h1
      style="
        margin: 0;
        font-size: 44px;
        line-height: 1.05;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 12px;
      "
    >
      Payment Failed
    </h1>

    <!-- Subtext -->
    <p style="margin: 0; color: #6b7280; font-size: 14px; margin-bottom: 28px">
      Try Again Later
    </p>

    <!-- Green button -->
    <div style="display: flex; justify-content: center">
      <a
        href="#"
        style="
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 12px 22px;
          background: #10b981;
          border-radius: 8px;
          color: white;
          text-decoration: none;
          font-weight: 600;
          box-shadow: 0 6px 20px rgba(16, 185, 129, 0.18);
          font-size: 15px;
          min-width: 210px;
          justify-content: center;
        "
      >
        <!-- small home/arrow icon (SVG) -->
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          style="flex: 0 0 16px"
        >
          <path
            d="M3 11.5L12 4l9 7.5"
            stroke="#ffffff"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M5 21V12.5h14V21"
            stroke="#ffffff"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Back To Home Page
      </a>
    </div>
  </div>
</div>

{% endblock content %}
