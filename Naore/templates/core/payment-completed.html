{% extends 'partials/base.html' %} {% load static %} {% block content %}

<!DOCTYPE html>

<body
  style="
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f3f3f3;
  "
>
  <!-- Invoice Container -->
  <div
    id="invoice"
    style="
      width: 750px;
      margin: 40px auto 20px;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      font-size: 16px;
      font-weight: bold;
    "
  >
    <h1
      style="text-align: center; margin: 0; font-size: 30px; font-weight: bold"
    >
      PAYMENT RECEIPT / INVOICE
    </h1>

    <hr style="margin: 20px 0; border: none; border-top: 2px solid #ddd" />

    <table style="width: 100%; border-collapse: collapse; margin-bottom: 25px">
      <tr>
        <td
          style="
            padding: 10px;
            font-weight: bold;
            background: #f5f5f5;
            width: 200px;
            font-size: 16px;
          "
        >
          Invoice Number:
        </td>
        <td style="padding: 10px; font-size: 16px">INV-001</td>
      </tr>

      <tr>
        <td style="padding: 10px; font-weight: bold; background: #f5f5f5">
          Date:
        </td>
        <td style="padding: 10px; font-size: 16px">2025-12-04</td>
      </tr>

      <tr>
        <td style="padding: 10px; font-weight: bold; background: #f5f5f5">
          Customer:
        </td>
        <td style="padding: 10px; font-size: 16px">Your Customer Name</td>
      </tr>

      <tr>
        <td style="padding: 10px; font-weight: bold; background: #f5f5f5">
          Status:
        </td>
        <td
          style="
            padding: 10px;
            color: green;
            font-weight: bold;
            font-size: 16px;
          "
        >
          Payment Successful
        </td>
      </tr>
    </table>

    <table style="width: 100%; border-collapse: collapse; margin-bottom: 25px">
      <tr style="background: #f5f5f5; font-size: 16px">
        <th style="padding: 12px; text-align: left; border: 1px solid #ddd">
          Item
        </th>
        <th style="padding: 12px; text-align: left; border: 1px solid #ddd">
          Qty
        </th>
        <th style="padding: 12px; text-align: left; border: 1px solid #ddd">
          Price
        </th>
        <th style="padding: 12px; text-align: left; border: 1px solid #ddd">
          Total
        </th>
      </tr>

      <tr style="font-size: 16px">
        <td style="padding: 12px; border: 1px solid #ddd">Product Name</td>
        <td style="padding: 12px; border: 1px solid #ddd">1</td>
        <td style="padding: 12px; border: 1px solid #ddd">$100</td>
        <td style="padding: 12px; border: 1px solid #ddd">$100</td>
      </tr>
    </table>

    <h2
      style="text-align: right; margin: 0; font-size: 24px; font-weight: bold"
    >
      Total Paid: $100
    </h2>
  </div>

  <!-- Bottom Buttons -->
  <div
    style="
      width: 750px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    "
  >
    <!-- Print Button -->
    <button
      onclick="window.print()"
      style="
        padding: 12px 20px;
        background: #0ea5e9;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
      "
    >
      🖨️ Print
    </button>

    <!-- Download Button -->
    <button
      onclick="downloadInvoice()"
      style="
        padding: 12px 20px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
      "
    >
      ⬇️ Download
    </button>
  </div>

  <script>
    function downloadInvoice() {
      const invoice = document.getElementById("invoice").outerHTML;
      const blob = new Blob([invoice], { type: "text/html" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "invoice.html";
      a.click();

      URL.revokeObjectURL(url);
    }
  </script>

  <style>
    @media print {
      body * {
        visibility: hidden !important;
      }
      #invoice,
      #invoice * {
        visibility: visible !important;
      }
      #invoice {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        margin: 0;
        padding: 0;
        box-shadow: none !important;
      }
    }
  </style>
</body>

{% endblock content %}
